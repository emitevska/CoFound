<svg xmlns="http://www.w3.org/2000/svg"
     width="360"
     height="105"
     viewBox="0 0 360 105">

    <defs>
        <linearGradient id="brand"
                        x1="0%" y1="0%"
                        x2="100%" y2="100%">

            <stop offset="0%"
                  stop-color="#8B5CF6"/>

            <stop offset="100%"
                  stop-color="#6D4AFF"/>

        </linearGradient>
    </defs>

    <!-- Logo background -->

    <rect x="18"
          y="15"
          width="75"
          height="75"
          rx="22"
          fill="url(#brand)"/>

    <!-- Connection symbol -->

    <g fill="none"
       stroke="#FFFFFF"
       stroke-width="5"
       stroke-linecap="round">

        <rect x="32"
              y="33"
              width="29"
              height="23"
              rx="11.5"
              transform="rotate(-35 46.5 44.5)"/>

        <rect x="50"
              y="49"
              width="29"
              height="23"
              rx="11.5"
              transform="rotate(-35 64.5 60.5)"/>

        <path d="M48 58 L63 47"/>

    </g>

    <!-- Brand name -->

    <text x="108"
          y="64"
          font-family="Arial, sans-serif"
          font-size="49"
          font-weight="bold"
          letter-spacing="-2.5"
          fill="#1E1B35">cofound<tspan fill="#6D4AFF">.</tspan></text>

    <!-- Brand slogan -->

    <text x="112"
          y="83"
          font-family="Arial, sans-serif"
          font-size="8.5"
          letter-spacing="1.8"
          fill="#817B98">

        CONNECT. COLLABORATE. CREATE.

    </text>

</svg>